[build]
  command = "npm run build"
  publish = "dist"

# /api/spoonacular/* → Netlify Function으로 프록시
[[redirects]]
  from = "/api/spoonacular/*"
  to = "/.netlify/functions/spoonacular/:splat"
  status = 200

# React Router SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
